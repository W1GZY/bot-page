<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite SeanBot</title>
    <!-- Redirect target: keep redirect pages out of search results. -->
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <!--
        ═══════════════════════════════════════════════════════════════════
        SINGLE SOURCE OF TRUTH for SeanBot's invite link.

        Every "Invite SeanBot" button on the site points to this page, so to
        change the invite target (e.g. a new client ID) only THIS FILE needs
        editing. Update the INVITE_URL constant below and the two inline
        copies marked with ★.
        ═══════════════════════════════════════════════════════════════════
    -->
    <script>
        // ★ INVITE_URL — update me, plus the two ★ spots below.
        const INVITE_URL = "https://discord.com/oauth2/authorize?client_id=1361721001120895114";
        window.location.replace(INVITE_URL);
    </script>
    <!-- ★ Meta refresh fallback (works even with JavaScript disabled). -->
    <meta http-equiv="refresh" content="0; url=https://discord.com/oauth2/authorize?client_id=1361721001120895114">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Phosphor icons: only the weights this site uses (skips thin/light) -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
    <link rel="stylesheet" href="global.css">
</head>
<body data-nav="none" data-title="Invite SeanBot" style="background: #1c1c21;">
    <div class="content" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
        <div style="text-align: center;" class="auto-fade-in">
            <h1 style="font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 12px;">Taking you to Discord…</h1>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">If you aren't redirected automatically, click below.</p>
            <!-- ★ Manual fallback link (also kept in sync from INVITE_URL). -->
            <a id="manual-link" class="btn-large btn-primary" href="https://discord.com/oauth2/authorize?client_id=1361721001120895114" target="_blank" rel="noopener"><i class="ph-fill ph-discord-logo"></i> Invite SeanBot</a>
        </div>
    </div>
    <script>
        // Keep the manual fallback link in sync with INVITE_URL above.
        document.getElementById('manual-link').href = INVITE_URL;
    </script>
</body>
</html>

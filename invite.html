<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite SeanBot</title>
    <!-- Redirect target: keep redirect pages out of search results. -->
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" href="/favicon.svg?v=706011f8" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico?v=0f68e761" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=f5ab2dbb">
    <!-- The invite link lives here and nowhere else. Every "Invite SeanBot"
         button on the site points at this page, so a new client ID means
         changing this constant and the two copies of it below. -->
    <script>
        // Change this, and the two copies of it below.
        const INVITE_URL = "https://discord.com/oauth2/authorize?client_id=1361721001120895114";
        window.location.replace(INVITE_URL);
    </script>
    <meta http-equiv="refresh" content="0; url=https://discord.com/oauth2/authorize?client_id=1361721001120895114">
    <!-- Self-hosted Inter: no font CDN sees a visitor. Rules live in global.css. -->
    <link rel="preload" href="assets/fonts/inter-latin.woff2?v=3100e775" as="font" type="font/woff2" crossorigin>

    <!-- Phosphor icons: only the weights this site uses (skips thin/light) -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
    <link rel="stylesheet" href="global.css?v=d6164ec0">
</head>
<body class="invite-page" data-nav="none" data-title="Invite SeanBot">
    <div class="content invite-shell">
        <div class="auto-fade-in invite-inner">
            <h1 class="invite-title">Taking you to Discord...</h1>
            <p class="invite-copy">If you aren't redirected automatically, click below.</p>
            <a id="manual-link" class="btn-large btn-primary" href="https://discord.com/oauth2/authorize?client_id=1361721001120895114" target="_blank" rel="noopener"><i class="ph-fill ph-discord-logo"></i> Invite SeanBot</a>
        </div>
    </div>
    <script>
        // Keep the manual fallback link in sync with INVITE_URL above.
        document.getElementById('manual-link').href = INVITE_URL;
    </script>
</body>
</html>

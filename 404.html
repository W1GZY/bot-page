<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeanBot - Page not found</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" href="/favicon.svg?v=706011f8" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico?v=0f68e761" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=f5ab2dbb">

    <!-- Self-hosted Inter: no font CDN sees a visitor. Rules live in global.css. -->
    <link rel="preload" href="assets/fonts/inter-latin.woff2?v=3100e775" as="font" type="font/woff2" crossorigin>

    <!-- Phosphor icons: only the weights this site uses (skips thin/light) -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">

    <script>
        // GitHub Pages serves 404.html for unknown paths, so route the
        // pretty /invite URL to the redirect page here.
        if (location.pathname.replace(/\/+$/, '') === '/invite') {
            location.replace('/invite.html');
        }
    </script>
    <script src="theme-init.js?v=b1713db3"></script>
    <link rel="stylesheet" href="global.css?v=d6164ec0">
    <script src="layout.js?v=20df8546" defer></script>
</head>

<body data-nav="none" data-title="Error 404">

    <div class="content not-found-shell">
        <div class="auto-fade-in not-found-inner">
            <div class="not-found-icon">
                <i class="ph-duotone ph-warning-circle"></i>
            </div>
            <h1 class="not-found-code">404</h1>
            <h2 class="not-found-title">Lost in the void?</h2>
            <p class="not-found-copy">
                The page you're looking for doesn't exist, or it has moved somewhere else.
            </p>
            <a href="/" class="btn-large btn-primary not-found-cta"><i class="ph ph-house"></i> Take me home</a>
        </div>
    </div>

</body>
</html>
